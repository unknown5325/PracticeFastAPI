<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новостная лента</title>
<style>
    :root {
        --bg-main: #0b0718;
        --card-bg: #140e24;
        --border-color: #2e1065;
        --accent-color: #8b5cf6;
        --accent-hover: #a78bfa;
        --text-main: #f3e8ff;
        --text-muted: #c084fc;
        --danger-color: #f43f5e;
        --danger-hover: #fb7185;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: var(--bg-main);
        background-image:
            radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.15), transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.1), transparent 40%);
        color: var(--text-main);
        min-height: 100vh;
        padding-top: 90px;
    }

    /* ===== ШАПКА ===== */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(20, 14, 36, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-color);
        z-index: 100;
        padding: 12px 24px;
    }

    .top-bar-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 1.1rem;
        flex-shrink: 0;
        border: 2px solid var(--border-color);
        box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        letter-spacing: 0.5px;
        object-fit: cover;
    }

    .user-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .user-name {
        color: var(--text-main);
        font-weight: 600;
        font-size: 1rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .user-role {
        color: var(--text-muted);
        font-size: 0.82rem;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .user-role::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px #22c55e;
    }

    .nav-buttons {
        display: flex;
        gap: 10px;
    }

    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }

    .btn-ghost {
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }

    .btn-ghost:hover {
        background: var(--card-bg);
        border-color: var(--accent-color);
        color: var(--accent-hover);
    }

    .btn-danger {
        background: transparent;
        color: var(--danger-color);
        border: 1px solid var(--danger-color);
    }

    .btn-danger:hover {
        background: var(--danger-color);
        color: white;
        box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }

    /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px 20px 40px;
    }

    .page-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .page-header h1 {
        font-size: 2.2rem;
        background: linear-gradient(90deg, var(--accent-color), var(--accent-hover));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }

    .page-header p {
        color: var(--text-muted);
        font-size: 1rem;
    }

    /* ===== ФОРМА ===== */
    .form-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 30px;
        box-shadow: 0 8px 30px rgba(139, 92, 246, 0.1);
    }

    .form-card h2 {
        color: var(--text-main);
        font-size: 1.3rem;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-card h2::before {
        content: "✎";
        color: var(--accent-color);
    }

    .form-group {
        margin-bottom: 14px;
    }

    .form-group label {
        display: block;
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-main);
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 90px;
    }

    .form-group input[type="file"] {
        padding: 10px;
        background: var(--bg-main);
        border: 1px dashed var(--border-color);
        border-radius: 10px;
        color: var(--text-muted);
        cursor: pointer;
    }

    .form-group input[type="file"]::file-selector-button {
        background: var(--card-bg);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 6px 12px;
        margin-right: 12px;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
    }

    .form-group input[type="file"]::file-selector-button:hover {
        border-color: var(--accent-color);
        color: var(--accent-hover);
    }

    .btn-primary {
        background: var(--accent-color);
        color: white;
        width: 100%;
        padding: 12px 22px;
        margin-top: 6px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
    }

    .btn-primary:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    /* ===== ЛЕНТА ===== */
    .feed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .feed-header h2 {
        color: var(--text-main);
        font-size: 1.3rem;
    }

    .counter {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 4px 12px;
        border-radius: 20px;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .news-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .news-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 22px;
        position: relative;
        animation: slideIn 0.3s ease;
        transition: border-color 0.2s, transform 0.2s;
        display: block;
        text-decoration: none;
        color: inherit;
    }

    .news-card:hover {
        border-color: var(--accent-color);
        transform: translateY(-2px);
        text-decoration: none;
        color: inherit;
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .news-card h3 {
        color: var(--text-main);
        font-size: 1.25rem;
        margin-bottom: 8px;
        padding-right: 40px;
    }

    .news-meta {
        display: flex;
        gap: 14px;
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .news-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .category-tag {
        background: rgba(139, 92, 246, 0.15);
        color: var(--accent-hover);
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        border: 1px solid rgba(139, 92, 246, 0.3);
    }

    /* ===== СЛАЙДЕР ИЗОБРАЖЕНИЙ ===== */
    .image-carousel {
        position: relative;
        width: 100%;
        max-height: 400px;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        background: var(--bg-main);
    }

    .carousel-track {
        display: flex;
        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        height: 100%;
    }

    .carousel-slide {
        min-width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
    }

    .carousel-image {
        width: 100%;
        height: 100%;
        max-height: 400px;
        object-fit: cover;
        display: block;
    }

    .carousel-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(11, 7, 24, 0.6);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: all 0.2s;
        z-index: 10;
        backdrop-filter: blur(4px);
    }

    .carousel-btn:hover { 
        background: var(--accent-color); 
        border-color: var(--accent-color);
    }

    .carousel-btn.prev { left: 10px; }
    .carousel-btn.next { right: 10px; }

    .carousel-dots {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
    }

    .carousel-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        padding: 0;
    }

    .carousel-dot.active { 
        background: var(--accent-color); 
        transform: scale(1.2);
    }

    /* Обычное изображение (если оно одно) */
    .news-image-single {
        width: 100%;
        max-height: 400px;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        background: var(--bg-main);
        display: block;
    }

    .news-text-wrapper {
        position: relative;
    }

    .news-text {
        color: var(--text-main);
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        margin-bottom: 0;
    }

    .news-text.truncated {
        position: relative;
        overflow: hidden;
    }

    .news-text.truncated::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 18px;
        background: linear-gradient(to bottom, rgba(20, 14, 36, 0), var(--card-bg) 95%);
        pointer-events: none;
    }

    .read-more-btn {
        display: inline-block;
        margin-top: 6px;
        color: var(--accent-hover);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
    }

    .news-card:hover .read-more-btn,
    .read-more-btn:hover {
        text-decoration: underline;
        color: var(--accent-color);
    }

    .delete-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--danger-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        transition: all 0.2s;
        z-index: 20; /* Выше слайдера */
    }

    .delete-btn:hover {
        background: var(--danger-color);
        color: white;
        border-color: var(--danger-color);
        transform: scale(1.05);
    }

    .empty-state {
        text-align: center;
        padding: 50px 20px;
        color: var(--text-muted);
        background: var(--card-bg);
        border: 1px dashed var(--border-color);
        border-radius: 16px;
    }

    .empty-state .icon {
        font-size: 3rem;
        margin-bottom: 12px;
        opacity: 0.5;
    }

    /* ===== МОБИЛКА ===== */
    @media (max-width: 600px) {
        body { padding-top: 80px; }
        .top-bar { padding: 10px 14px; }
        .avatar { width: 40px; height: 40px; font-size: 0.95rem; }
        .user-info { gap: 10px; }
        .user-name { font-size: 0.92rem; }
        .user-role { font-size: 0.75rem; }
        .nav-buttons { gap: 6px; }
        .btn { padding: 8px 12px; font-size: 0.82rem; }
        .page-header h1 { font-size: 1.6rem; }
        .container { padding: 20px 12px 30px; }
        .carousel-btn { width: 32px; height: 32px; font-size: 1rem; }
    }
</style>
</head>
<body>

<!-- ===== ШАПКА ===== -->
<header class="top-bar">
    <div class="top-bar-inner">
        <div class="user-info">
            <img class="avatar" id="avatar" src="/static/avatars/{{ logo }}" alt="Аватар" onerror="this.style.display='none'">
            <div class="user-text">
                <div class="user-name" id="userName">{{ name }}</div>
                <div class="user-role" id="userRole">{{ role }}</div>
            </div>
        </div>
        <nav class="nav-buttons">
            <a href="/home"><button class="btn btn-ghost" id="homeBtn">🏠 Главная</button></a>
            <form action="/logout" method="get" style="margin: 0;">
                <button type="submit" class="btn btn-danger" id="logoutBtn">Выйти</button>
            </form>
        </nav>
    </div>
</header>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<div class="container">
    <div class="page-header">
        <h1>📰 Моя новостная лента</h1>
        <p>Делитесь новостями и оставайтесь в курсе событий</p>
    </div>

    <section class="form-card">
        <h2>Добавить новость</h2>
        <form id="newsForm" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Заголовок *</label>
                <input type="text" id="title" name="header" maxlength="100" required placeholder="Например: Открытие нового парка">
                <input type="hidden" id="newsIdInput" name="id">
            </div>
            <div class="form-group">
                <label for="category">Категория</label>
                <input type="text" id="category" name="category" maxlength="30" placeholder="Технологии, Спорт, Наука...">
            </div>
            <div class="form-group">
                <label for="imageInput">Изображения (до 5 шт., зажмите Ctrl для выбора нескольких)</label>
                <input type="file" name="imgNews" id="imageInput" accept="image/*" multiple>
            </div>
            <div class="form-group">
                <label for="text">Текст новости *</label>
                <textarea id="text" name="news" required placeholder="Расскажите подробнее..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Опубликовать</button>
        </form>
    </section>

    <div class="feed-header">
        <h2>Лента новостей</h2>
        <span class="counter" id="counter">0 новостей</span>
    </div>
    <div class="news-list" id="newsList"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Данные пользователя
    const userNameEl = document.getElementById('userName');
    const userRoleEl = document.getElementById('userRole');
    const avatarEl = document.getElementById('avatar');

    const user = {
        name: userNameEl ? userNameEl.textContent.trim() : 'Гость',
        role: userRoleEl ? userRoleEl.textContent.trim() : 'User'
    };

    if (avatarEl && userNameEl && !avatarEl.src.includes('/static/avatars/')) {
        const parts = user.name.split(/\s+/);
        const first = parts[0] ? parts[0][0] : '';
        const second = parts[1] ? parts[1][0] : '';
        avatarEl.textContent = (first + second).toUpperCase() || '??';
    }

    // 2. Элементы страницы
    const form = document.getElementById('newsForm');
    const newsList = document.getElementById('newsList');
    const counter = document.getElementById('counter');
    const homeBtn = document.getElementById('homeBtn');

    const MONTHS = ['января','февраля','марта','апреля','мая','июня',
                    'июля','августа','сентября','октября','ноября','декабря'];

    function formatDate(ts) {
        const d = new Date(ts);
        return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function pluralize(n, forms) {
        const mod10 = n % 10, mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return forms[0];
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
        return forms[2];
    }

    function loadNews() {
        try { return JSON.parse(localStorage.getItem('news')) || []; }
        catch { return []; }
    }

    function saveNews(news) {
        localStorage.setItem('news', JSON.stringify(news));
    }

    function generateId() {
        return `${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
    }

    // 3. Отрисовка карточек
    function renderNews() {
        const news = loadNews();
        if (!newsList) return;
        
        newsList.innerHTML = '';
        if (counter) {
            counter.textContent = `${news.length} ${pluralize(news.length, ['новость','новости','новостей'])}`;
        }

        if (news.length === 0) {
            newsList.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>Пока нет новостей. Будьте первым, кто опубликует!</p>
                </div>`;
            return;
        }

        news.sort((a, b) => b.date - a.date);

        news.forEach((item, index) => {
            const card = document.createElement('a');
            card.className = 'news-card';
            const newsId = item.id || `legacy-${index}`;

            const params = new URLSearchParams({
                id: newsId,
                author: item.author || '',
                category: item.category || ''
            });
            card.href = item.url || `/form?${params.toString()}`;

            const isStaff = user.role === 'Admin' || user.role === 'Moderator';
            const isLongText = item.text && item.text.length > 50;
            const displayText = isLongText ? item.text.slice(0, 50) + '...' : (item.text || '');
            
            // Обработка изображений: поддерживаем и новый массив images, и старое поле image
            const images = item.images || (item.image ? [item.image] : []);
            let imagesHtml = '';

            if (images.length === 1) {
                // Если картинка одна, показываем её просто как изображение
                imagesHtml = `<img src="${images[0]}" alt="Изображение новости" class="news-image-single">`;
            } else if (images.length > 1) {
                // Если картинок несколько, создаем слайдер
                const slides = images.map(img => 
                    `<div class="carousel-slide"><img src="${img}" class="carousel-image" alt="Фото новости"></div>`
                ).join('');
                
                const dots = images.map((_, i) => 
                    `<button class="carousel-dot ${i === 0 ? 'active' : ''}" data-index="${i}" type="button"></button>`
                ).join('');

                imagesHtml = `
                    <div class="image-carousel" data-current="0">
                        <div class="carousel-track">${slides}</div>
                        <button class="carousel-btn prev" type="button">❮</button>
                        <button class="carousel-btn next" type="button">❯</button>
                        <div class="carousel-dots">${dots}</div>
                    </div>
                `;
            }

            card.innerHTML = `
                ${isStaff ? `<button type="button" class="delete-btn" data-id="${newsId}" title="Удалить">×</button>` : ''}
                ${imagesHtml}
                <h3>${escapeHtml(item.title)}</h3>
                <div class="news-meta">
                    <span>📅 ${formatDate(item.date)}</span>
                    ${item.author ? `<span>✍️ ${escapeHtml(item.author)}</span>` : ''}
                    ${item.category ? `<span class="category-tag">${escapeHtml(item.category)}</span>` : ''}
                </div>
                <div class="news-text-wrapper">
                    <p class="news-text ${isLongText ? 'truncated' : ''}">${escapeHtml(displayText)}</p>
                    ${isLongText ? `<span class="read-more-btn">Ещё</span>` : ''}
                </div>
            `;
            
            newsList.appendChild(card);
        });
    }

    // 4. Удаление и управление слайдером (делегирование событий)
    if (newsList) {
        newsList.addEventListener('click', e => {
            // Удаление новости
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                e.preventDefault();
                e.stopPropagation();
                if (confirm('Удалить эту новость?')) {
                    const news = loadNews().filter((n, index) => String(n.id || `legacy-${index}`) !== String(deleteBtn.dataset.id));
                    saveNews(news);
                    renderNews();
                }
                return;
            }

            // Управление слайдером
            const carousel = e.target.closest('.image-carousel');
            if (carousel && (e.target.closest('.carousel-btn') || e.target.closest('.carousel-dot'))) {
                e.preventDefault(); // Запрещаем переход по ссылке <a> при клике на кнопки слайдера
                e.stopPropagation();

                const track = carousel.querySelector('.carousel-track');
                const dots = carousel.querySelectorAll('.carousel-dot');
                const totalSlides = dots.length;
                let currentIndex = parseInt(carousel.dataset.current || '0');

                if (e.target.closest('.carousel-btn.prev')) {
                    currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                } else if (e.target.closest('.carousel-btn.next')) {
                    currentIndex = (currentIndex + 1) % totalSlides;
                } else if (e.target.closest('.carousel-dot')) {
                    currentIndex = parseInt(e.target.closest('.carousel-dot').dataset.index);
                }

                // Обновляем состояние и визуал
                carousel.dataset.current = currentIndex;
                track.style.transform = `translateX(-${currentIndex * 100}%)`;

                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentIndex);
                });
            }
        });
    }

    if (homeBtn) {
        homeBtn.addEventListener('click', (e) => {
            // e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    }

    // 5. Сохранение при отправке формы
    if (form) {
        form.addEventListener('submit', (e) => {
                    // 1. Получаем скрытый инпут
            const idInput = document.getElementById('newsIdInput');
        
            // 2. Если ID еще нет (новая новость), генерируем его и записываем в инпут!
            // Если ID уже есть (редактирование), оставляем старый.

            const newId = generateId();
            idInput.value = newId
            const titleInput = document.getElementById('title');
            const categoryInput = document.getElementById('category');
            const textInput = document.getElementById('text');
            const imageInput = document.getElementById('imageInput');

            const files = imageInput ? Array.from(imageInput.files) : [];

            if (files.length > 5) {
                alert('Можно загрузить не более 5 изображений за раз.');
                return;
            }

            const totalSize = files.reduce((sum, file) => sum + file.size, 0);
            if (totalSize > 3 * 1024 * 1024) { // 3 МБ
                alert('Общий размер изображений слишком большой. Максимальный общий размер: 3 МБ.');
                return;
            }

            const processFile = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => resolve(event.target.result);
                    reader.onerror = () => reject(new Error('Ошибка при чтении файла'));
                    reader.readAsDataURL(file);
                });
            };

            const saveNewsItem = (imagesArray) => {
                const news = loadNews();
                news.push({
                    id: newId,
                    title: titleInput ? titleInput.value.trim() : '',
                    author: user.name,
                    category: categoryInput ? categoryInput.value.trim() : '',
                    text: textInput ? textInput.value.trim() : '',
                    images: imagesArray || [], // Сохраняем как массив
                    date: Date.now()
                });
                
                try {
                    saveNews(news);
                    form.reset();
                    renderNews();
                } catch (err) {
                    if (err.name === 'QuotaExceededError' || err.code === 22) {
                        alert('Недостаточно места в хранилище браузера. Удалите старые новости или загрузите картинки меньшего размера.');
                        const currentNews = loadNews();
                        saveNews(currentNews.filter(n => n.id !== newId));
                    } else {
                        alert('Произошла ошибка при сохранении: ' + err.message);
                    }
                }
            };

            if (files.length > 0) {
                const promises = files.map(file => processFile(file));
                Promise.all(promises)
                    .then(imagesArray => {
                        saveNewsItem(imagesArray);
                    })
                    .catch(err => {
                        alert('Ошибка при обработке изображений: ' + err.message);
                    });
            } else {
                saveNewsItem([]);
            }
        });
    }

    renderNews();
});
</script>
</body>
</html>
