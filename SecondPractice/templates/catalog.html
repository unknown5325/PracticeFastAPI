<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новостная лента</title>
<style>
    :root {
        --bg-main: #0b0718;
        --card-bg: #140e24;
        --border-color: #2e1065;
        --accent-color: #8b5cf6;
        --accent-hover: #a78bfa;
        --text-main: #f3e8ff;
        --text-muted: #c084fc;
        --danger-color: #f43f5e;
        --danger-hover: #fb7185;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: var(--bg-main);
        background-image:
            radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.15), transparent 40%),
            radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.1), transparent 40%);
        color: var(--text-main);
        min-height: 100vh;
        padding-top: 90px;
    }

        /* === Действия (лайки/дизлайки/комменты) === */
    .card-actions {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border-color);
    }

    .action-btn {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        transition: all 0.2s;
        font-family: inherit;
    }

    .action-btn:hover {
        border-color: var(--accent-color);
        color: var(--text-main);
        background: rgba(139, 92, 246, 0.1);
    }

    /* Активные состояния кнопок */
    .action-btn.active-like {
        border-color: #22c55e;
        color: #22c55e;
        background: rgba(34, 197, 94, 0.1);
    }

    .action-btn.active-dislike {
        border-color: var(--danger-color);
        color: var(--danger-color);
        background: rgba(244, 63, 94, 0.1);
    }

    /* === Секция комментариев === */
    .comments-section {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border-color);
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .comments-list {
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Кастомный скроллбар для комментариев */
    .comments-list::-webkit-scrollbar { width: 4px; }
    .comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .comment-item {
        background: var(--bg-main);
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
    }

    .comment-author {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent-hover);
        margin-bottom: 4px;
    }

    .comment-text {
        font-size: 0.9rem;
        color: var(--text-main);
        line-height: 1.4;
    }

    .comment-form {
        display: flex;
        gap: 8px;
    }

    .comment-input {
        flex: 1;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 8px 12px;
        color: var(--text-main);
        font-size: 0.9rem;
        font-family: inherit;
    }

    .comment-input:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    .btn-send {
        background: var(--accent-color);
        color: white;
        border: none;
        border-radius: 8px;
        width: 36px;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
    }

    .btn-send:hover {
        background: var(--accent-hover);
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px 20px 40px;
    }

    /* ===== ШАПКА ===== */
    .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(20, 14, 36, 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-color);
        z-index: 100;
        padding: 12px 24px;
    }

    .top-bar-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }

    .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 1.1rem;
        flex-shrink: 0;
        border: 2px solid var(--border-color);
        box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
        letter-spacing: 0.5px;
    }

    .user-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .user-name {
        color: var(--text-main);
        font-weight: 600;
        font-size: 1rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .user-role {
        color: var(--text-muted);
        font-size: 0.82rem;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .user-role::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px #22c55e;
    }

    .nav-buttons {
        display: flex;
        gap: 10px;
    }

    .btn {
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
    }

    .btn-ghost {
        background: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }

    .btn-ghost:hover {
        background: var(--card-bg);
        border-color: var(--accent-color);
        color: var(--accent-hover);
    }

    .btn-danger {
        background: transparent;
        color: var(--danger-color);
        border: 1px solid var(--danger-color);
    }

    .btn-danger:hover {
        background: var(--danger-color);
        color: white;
        box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
    }

    /* ===== ЗАГОЛОВОК СТРАНИЦЫ ===== */
    .page-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .page-header h1 {
        font-size: 2.2rem;
        background: linear-gradient(90deg, var(--accent-color), var(--accent-hover));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
    }

    .page-header p {
        color: var(--text-muted);
        font-size: 1rem;
    }

    /* ===== ФОРМА ===== */
    .form-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 30px;
        box-shadow: 0 8px 30px rgba(139, 92, 246, 0.1);
    }

    .form-card h2 {
        color: var(--text-main);
        font-size: 1.3rem;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-card h2::before {
        content: "✎";
        color: var(--accent-color);
    }

    .form-group {
        margin-bottom: 14px;
    }

    .form-group label {
        display: block;
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg-main);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-main);
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 90px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .btn-primary {
        background: var(--accent-color);
        color: white;
        width: 100%;
        padding: 12px 22px;
        margin-top: 6px;
    }

    .btn-primary:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
    }

    /* ===== ЛЕНТА ===== */
    .feed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .feed-header h2 {
        color: var(--text-main);
        font-size: 1.3rem;
    }

    .counter {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 4px 12px;
        border-radius: 20px;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .news-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .news-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 22px;
        position: relative;
        animation: slideIn 0.3s ease;
        transition: border-color 0.2s, transform 0.2s;
    }

    .news-card:hover {
        border-color: var(--accent-color);
        transform: translateY(-2px);
    }

    @keyframes slideIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .news-card h3 {
        color: var(--text-main);
        font-size: 1.25rem;
        margin-bottom: 8px;
        padding-right: 40px;
    }

    .news-meta {
        display: flex;
        gap: 14px;
        color: var(--text-muted);
        font-size: 0.85rem;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    .news-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .category-tag {
        background: rgba(139, 92, 246, 0.15);
        color: var(--accent-hover);
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.8rem;
        border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .news-text {
        color: var(--text-main);
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
    }

    .delete-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--danger-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        transition: all 0.2s;
    }

    .delete-btn:hover {
        background: var(--danger-color);
        color: white;
        border-color: var(--danger-color);
        transform: scale(1.05);
    }

    .empty-state {
        text-align: center;
        padding: 50px 20px;
        color: var(--text-muted);
        background: var(--card-bg);
        border: 1px dashed var(--border-color);
        border-radius: 16px;
    }

    .empty-state .icon {
        font-size: 3rem;
        margin-bottom: 12px;
        opacity: 0.5;
    }

    /* ===== МОБИЛКА ===== */
    @media (max-width: 600px) {
        body { padding-top: 80px; }
        .top-bar { padding: 10px 14px; }
        .avatar { width: 40px; height: 40px; font-size: 0.95rem; }
        .user-info { gap: 10px; }
        .user-name { font-size: 0.92rem; }
        .user-role { font-size: 0.75rem; }
        .nav-buttons { gap: 6px; }
        .btn { padding: 8px 12px; font-size: 0.82rem; }
        .form-row { grid-template-columns: 1fr; }
        .page-header h1 { font-size: 1.6rem; }
        .container { padding: 20px 12px 30px; }
    }
</style>
</head>
<body>

<!-- ===== ШАПКА ===== -->
<header class="top-bar">
    <div class="top-bar-inner">
        <div class="user-info">
            <img class="avatar" id="avatar" src="/static/avatars/{{ logo }}" alt="">
            <div class="user-text">
                <div class="user-name" name="name" id="userName">{{ name }}</div>
                <div class="user-role" name="role" id="userRole">{{ role }}</div>
            </div>
        </div>
        <nav class="nav-buttons">
            <a href="/home"><button class="btn btn-ghost" id="homeBtn">🏠 Главная</button></a>
            <form action="/logout" method="get" style="margin: 0;">
                <button type="submit" class="btn btn-danger" id="logoutBtn">Выйти</button>
            </form>
        </nav>
    </div>
</header>

<!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
<div class="container">
    <div class="page-header">
        <h1>📰 Моя новостная лента</h1>
        <p>Делитесь новостями и оставайтесь в курсе событий</p>
    </div>

    <section class="form-card">
        <h2>Добавить новость</h2>
        <form id="newsForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">Заголовок *</label>
                    <input type="text" id="title" maxlength="100" required placeholder="Например: Открытие нового парка">
                </div>
                <div class="form-group">
                    <label for="author">Автор</label>
                    <input type="text" id="author" maxlength="40" placeholder="Ваше имя">
                </div>
            </div>
            <div class="form-group">
                <label for="category">Категория</label>
                <input type="text" id="category" maxlength="30" placeholder="Технологии, Спорт, Наука...">
            </div>
            <div class="form-group">
                <label for="text">Текст новости *</label>
                <textarea id="text" required placeholder="Расскажите подробнее..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Опубликовать</button>
        </form>
    </section>

    <div class="feed-header">
        <h2>Лента новостей</h2>
        <span class="counter" id="counter">0 новостей</span>
    </div>

        <!-- Действия: лайки, дизлайки, комментарии
    <div class="card-actions">
        <button class="action-btn like-btn" data-id="item-1">
            <span class="icon">👍</span> <span class="count">12</span>
        </button>
        <button class="action-btn dislike-btn" data-id="item-1">
            <span class="icon">👎</span> <span class="count">2</span>
        </button>
        <button class="action-btn comment-toggle-btn" data-id="item-1">
            <span class="icon">💬</span> <span class="count">3</span>
        </button>
    </div>


    <div class="comments-section" id="comments-item-1" style="display: none;">
        <div class="comments-list">

            <div class="comment-item">
                <div class="comment-author">Алексей</div>
                <div class="comment-text">Отличный инструмент, очень помог в работе!</div>
            </div>
        </div>
        <form class="comment-form" data-id="item-1">
            <input type="text" class="comment-input" placeholder="Написать комментарий..." required autocomplete="off">
            <button type="submit" class="btn-send">➤</button>
        </form>
    </div> -->

    <div class="news-list" id="newsList"></div>
</div>

<script>
    // ===== Данные пользователя =====
    const user = {
        name: document.getElementById('userName')?.textContent.trim(),
        role: document.getElementById('userRole')?.textContent.trim()
    };

    function initAvatar() {
        const avatar = document.getElementById('avatar');
        const parts = user.name.trim().split(/\s+/);
        const initials = (parts[0]?.[0] || '') + (parts[1]?.[0] || '');
        avatar.textContent = initials.toUpperCase() || '??';
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userRole').textContent = user.role;
    }
    initAvatar();

    // ===== Кнопки шапки =====
    document.getElementById('homeBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // document.getElementById('logoutBtn').addEventListener('click', () => {
    //     if (confirm('Вы действительно хотите выйти?')) {
    //         alert('Вы вышли из системы');
    //         // Здесь можно добавить редирект: window.location.href = '/login';
    //     }
    // });

    // ===== Новостная лента =====
    const form = document.getElementById('newsForm');
    const newsList = document.getElementById('newsList');
    const counter = document.getElementById('counter');

    const MONTHS = ['января','февраля','марта','апреля','мая','июня',
                    'июля','августа','сентября','октября','ноября','декабря'];

    function formatDate(ts) {
        const d = new Date(ts);
        return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function pluralize(n, forms) {
        const mod10 = n % 10, mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return forms[0];
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
        return forms[2];
    }

    function loadNews() {
        try { return JSON.parse(localStorage.getItem('news')) || []; }
        catch { return []; }
    }

    function saveNews(news) {
        localStorage.setItem('news', JSON.stringify(news));
    }

    function renderNews() {
        const news = loadNews();
        newsList.innerHTML = '';

        counter.textContent = `${news.length} ${pluralize(news.length, ['новость','новости','новостей'])}`;

        if (news.length === 0) {
            newsList.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>Пока нет новостей. Будьте первым, кто опубликует!</p>
                </div>`;
            return;
        }

        news.sort((a, b) => b.date - a.date);

        news.forEach(item => {
            const card = document.createElement('article');
            card.className = 'news-card';
            if (user.role == 'Admin' || user.role == 'Moderator'){
                card.innerHTML = `
                <button class="delete-btn" data-id="${item.id}" title="Удалить">×</button>
                <h3>${escapeHtml(item.title)}</h3>
                <div class="news-meta">
                    <span>📅 ${formatDate(item.date)}</span>
                    ${item.author ? `<span>✍️ ${escapeHtml(item.author)}</span>` : ''}
                    ${item.category ? `<span class="category-tag">${escapeHtml(item.category)}</span>` : ''}
                </div>
                <p class="news-text">${escapeHtml(item.text)}</p>
            `;
            }
            else{
                card.innerHTML = `
                <h3>${escapeHtml(item.title)}</h3>
                <div class="news-meta">
                    <span>📅 ${formatDate(item.date)}</span>
                    ${item.author ? `<span>✍️ ${escapeHtml(item.author)}</span>` : ''}
                    ${item.category ? `<span class="category-tag">${escapeHtml(item.category)}</span>` : ''}
                </div>
                <p class="news-text">${escapeHtml(item.text)}</p>
            `;
            }
            
            newsList.appendChild(card);
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteNews(btn.dataset.id));
        });
    }

    function deleteNews(id) {
        if (!confirm('Удалить эту новость?')) return;
        const news = loadNews().filter(n => n.id !== id);
        saveNews(news);
        renderNews();
    }

    form.addEventListener('submit', e => {
        e.preventDefault();
        const news = loadNews();
        news.push({
            id: Date.now().toString(),
            title: document.getElementById('title').value.trim(),
            author: document.getElementById('author').value.trim(),
            category: document.getElementById('category').value.trim(),
            text: document.getElementById('text').value.trim(),
            date: Date.now()
        });
        saveNews(news);
        form.reset();
        renderNews();
        document.getElementById('title').focus();
    });

    renderNews();

    document.addEventListener('DOMContentLoaded', () => {
        
        // 1. Переключение видимости комментариев
        document.querySelectorAll('.comment-toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.id;
                const commentsSection = document.getElementById(`comments-${id}`);
                if (commentsSection) {
                    const isHidden = commentsSection.style.display === 'none';
                    commentsSection.style.display = isHidden ? 'block' : 'none';
                }
            });
        });

        // 2. Логика лайков и дизлайков (взаимоисключение)
        document.querySelectorAll('.like-btn, .dislike-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const isLike = this.classList.contains('like-btn');
                const activeClass = isLike ? 'active-like' : 'active-dislike';
                const oppositeClass = isLike ? 'active-dislike' : 'active-like';
                const countSpan = this.querySelector('.count');
                let count = parseInt(countSpan.textContent);

                if (this.classList.contains(activeClass)) {
                    // Если уже нажато, отменяем
                    this.classList.remove(activeClass);
                    countSpan.textContent = count - 1;
                } else {
                    // Если нажата противоположная кнопка, сбрасываем её
                    const oppositeBtn = this.parentElement.querySelector(isLike ? '.dislike-btn' : '.like-btn');
                    if (oppositeBtn.classList.contains(oppositeClass)) {
                        oppositeBtn.classList.remove(oppositeClass);
                        oppositeBtn.querySelector('.count').textContent = parseInt(oppositeBtn.querySelector('.count').textContent) - 1;
                    }
                    // Активируем текущую
                    this.classList.add(activeClass);
                    countSpan.textContent = count + 1;
                }
                // TODO: Здесь можно добавить fetch-запрос на сервер для сохранения
            });
        });

        // 3. Добавление нового комментария
        document.querySelectorAll('.comment-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const input = this.querySelector('.comment-input');
                const text = input.value.trim();
                if (!text) return;

                const commentsList = this.parentElement.querySelector('.comments-list');
                
                // Создаем DOM-элемент комментария
                const newComment = document.createElement('div');
                newComment.className = 'comment-item';
                newComment.innerHTML = `
                    <div class="comment-author">Вы</div>
                    <div class="comment-text">${escapeHtml(text)}</div>
                `;
                
                commentsList.appendChild(newComment);
                commentsList.scrollTop = commentsList.scrollHeight; // Автопрокрутка вниз
                
                // Обновляем счетчик комментариев на кнопке
                const toggleBtn = document.querySelector(`.comment-toggle-btn[data-id="${this.dataset.id}"]`);
                if (toggleBtn) {
                    const countSpan = toggleBtn.querySelector('.count');
                    countSpan.textContent = parseInt(countSpan.textContent) + 1;
                }

                input.value = ''; // Очистка поля
                // TODO: Здесь можно добавить fetch-запрос на сервер для сохранения
            });
        });

        // Простая защита от XSS при вставке текста
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    });

</script>
</body>
</html>
