<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация профиля</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo"><a href="home">⚡ AI.Platform</a></div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <p class="auth-subtitle">Создайте аккаунт, чтобы получить доступ</p>
            
            <form action="#">
                <div class="form-group">
                    <label for="name">Ваше имя</label>
                    <input type="text" id="name" class="form-control" placeholder="Александр" required>
                </div>
                <div class="form-group">
                    <label for="email">Электронная почта</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" class="form-control" placeholder="Минимум 8 знаков" required>
                </div>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>

            <div class="auth-footer">
                Уже зарегистрированы? <a href="login">Войти</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 AI.Platform. Все права tracking.
    </footer>

</body>
</html>
